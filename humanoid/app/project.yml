# Xcode project spec. The .xcodeproj is generated, never committed:
#
#   cd humanoid/app && xcodegen generate && open BabyBlender.xcodeproj
#
# XcodeGen builds and runs on Linux too, so the agent can regenerate and
# sanity-check this spec without a Mac. Whether the generated project opens
# cleanly in Xcode is confirmed by the macOS CI job, not assumed.
name: BabyBlender
options:
  bundleIdPrefix: com.mentis.birb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The Swift package keeps its own name. `HumanoidCore` is the module the
# exporters and the 193 tests import, and it is not what anyone sees: the
# product is BabyBlender, the bundle is com.mentis.birb.BabyBlender, and the
# home screen says Baby Blender. Renaming the module would touch every import,
# the verify script and CI for no visible gain.
packages:
  HumanoidPackage:
    path: ..

targets:
  BabyBlender:
    type: application
    platform: iOS
    sources:
      - path: BabyBlender
    dependencies:
      - package: HumanoidPackage
        product: HumanoidCore
      - package: HumanoidPackage
        product: ExporterVRM
      - package: HumanoidPackage
        product: ExporterFBX
    info:
      path: BabyBlender/Info.plist
      properties:
        CFBundleDisplayName: Baby Blender
        UILaunchScreen: {}
        # All four, deliberately. An iPad app that does not set
        # UIRequiresFullScreen has to support every orientation or Xcode warns
        # and the system refuses it multitasking — and a sculpting tool that
        # cannot sit beside a reference image is the wrong tool.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The editor is a Pencil tool; the viewport wants the whole screen.
        UIStatusBarHidden: true
        UIRequiredDeviceCapabilities:
          - metal
    settings:
      base:
        # iPad only: this is a Pencil-driven tool.
        TARGETED_DEVICE_FAMILY: "2"
        # Shaders.metal is picked up automatically by the sources glob; this
        # keeps the compiler strict about the ones we write.
        MTL_FAST_MATH: NO
        # Needed once the Metal viewport and the C++ geometry bridge land.
        SWIFT_OBJC_INTEROP_MODE: objcxx
        GENERATE_INFOPLIST_FILE: NO

# Two schemes, and the second one is the point.
#
# Xcode's Run button builds DEBUG, which is `-Onone`. On this Double-heavy,
# SIMD-free geometry code that is ten to forty times slower than release: the
# paint map measured 27 ms in release on the build box and **3,242 ms on the
# iPad in debug**, and the second device run's "Hang detected" lines were all
# taken that way. No number from a debug run with the debugger attached is a
# number about this app, so the release scheme is shipped rather than left as
# an instruction nobody follows.
#
# Still worth doing by hand for a feel test, because a scheme cannot express
# them: Edit Scheme -> Run -> Options -> Metal API Validation = Disabled and
# GPU Frame Capture = Disabled, then stop Xcode and launch from the home
# screen. A debugger attached to a Metal app is not the app.
schemes:
  BabyBlender:
    build:
      targets:
        BabyBlender: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BabyBlender (Release):
    build:
      targets:
        BabyBlender: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
