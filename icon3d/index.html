<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e4e7ec">
<title>Icon3D Catalogue — Birb Labs</title>
<style>
  :root {
    --paper: #e4e7ec;
    --ink: #1b2130;
    --dim: #6b7280;
    --line: rgba(27, 33, 48, 0.13);
    --card: rgba(255, 255, 255, 0.62);
    --card-on: rgba(255, 255, 255, 0.94);
    --shadow: rgba(47, 56, 78, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font-family: ui-rounded, "Avenir Next", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    min-height: 100vh; min-height: 100svh;
    padding: max(env(safe-area-inset-top, 0px), 26px) clamp(18px, 4vw, 56px)
             calc(max(env(safe-area-inset-bottom, 0px), 24px) + 96px);
    display: grid; align-content: center;
  }
  header { max-width: 760px; margin-bottom: clamp(28px, 6vh, 64px); }
  .eyebrow {
    margin: 0 0 12px; color: var(--dim); font-size: 10px; font-weight: 800;
    letter-spacing: 0.34em; text-transform: uppercase;
  }
  h1 { margin: 0; font-size: clamp(38px, 6vw, 76px); line-height: 0.94; letter-spacing: -0.055em; word-spacing: .08em; }
  .intro { margin: 18px 0 0; max-width: 560px; color: var(--dim); font-size: clamp(15px, 1.8vw, 18px); line-height: 1.55; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 24px); }
  .tile {
    position: relative; min-width: 0; min-height: clamp(260px, 34vw, 430px); cursor: pointer;
    border: 1px solid var(--line); border-radius: clamp(24px, 3vw, 38px);
    background: var(--card); overflow: hidden; box-shadow: 0 22px 60px transparent;
    transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
  }
  .tile:hover { transform: translateY(-3px); background: rgba(255,255,255,.78); }
  .tile:has(input:focus-visible) { outline: 3px solid rgba(48,46,201,.35); outline-offset: 3px; }
  .tile:has(input:checked) {
    background: var(--card-on); border-color: rgba(48, 46, 201, 0.32);
    box-shadow: 0 22px 60px var(--shadow); transform: translateY(-3px);
  }
  .tile input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .check {
    position: absolute; z-index: 2; top: 18px; right: 18px; width: 27px; height: 27px;
    display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%;
    background: rgba(255,255,255,.72); color: transparent; font-size: 15px; font-weight: 900;
    transition: background 150ms ease, color 150ms ease, transform 150ms ease;
  }
  input:checked + .check { color: white; background: var(--ink); transform: scale(1.06); }
  .art { height: 72%; padding: clamp(36px, 5vw, 68px); display: grid; place-items: center; }
  .art svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 16px 14px rgba(40,48,70,.13)); }
  .copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px 22px; }
  .copy small { display: block; color: var(--dim); font-size: 9px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
  .copy strong { display: block; margin-top: 5px; font-size: clamp(18px, 2vw, 25px); letter-spacing: -.025em; }
  .action {
    position: fixed; z-index: 20; left: 50%; bottom: max(env(safe-area-inset-bottom, 0px), 18px);
    transform: translateX(-50%); width: min(calc(100% - 36px), 520px); padding: 7px;
    display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.82); box-shadow: 0 16px 44px rgba(40,48,70,.16); backdrop-filter: blur(18px);
  }
  .selection { min-width: 0; padding-left: 13px; flex: 1; color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .action button {
    appearance: none; border: 0; border-radius: 999px; padding: 14px 22px;
    background: var(--ink); color: white; font: inherit; font-size: 11px; font-weight: 850;
    letter-spacing: .13em; text-transform: uppercase; cursor: pointer;
  }
  .action button:disabled { opacity: .38; cursor: default; }
  @media (max-width: 720px) {
    .shell { align-content: start; padding-top: max(env(safe-area-inset-top, 0px), 24px); }
    header { margin-bottom: 28px; }
    .grid { grid-template-columns: 1fr; }
    .tile { min-height: 270px; }
    .art { height: 74%; padding: 42px 68px; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .check { transition: none; } }
</style>
</head>
<body>
<main class="shell">
  <header>
    <p class="eyebrow">Birb Labs · study</p>
    <h1>Choose your icons.</h1>
    <p class="intro">Select one, two or all three. We’ll extrude the original artwork and place the finished 3D icons together in the studio.</p>
  </header>
  <form data-form>
    <div class="grid" data-grid></div>
    <div class="action">
      <div class="selection" data-selection>No icons selected</div>
      <button type="submit" disabled data-view>View selected</button>
    </div>
  </form>
</main>
<script type="module">
import { getIcon, ICONS, PRODUCTS } from '/icon3d/src/icons/index.js';
import { createIconPreview } from '/icon3d/src/icons/preview.js';

const params = new URLSearchParams(location.search);
const legacyIcon = params.get('icon');
if (legacyIcon && ICONS[legacyIcon]) {
    const passthrough = new URLSearchParams(params);
    passthrough.delete('icon');
    passthrough.set('icons', legacyIcon);
    location.replace(`/svg/view?${passthrough}`);
}

const selected = new Set((params.get('selected') || '').split(',').filter((id) => ICONS[id]));
const grid = document.querySelector('[data-grid]');
const form = document.querySelector('[data-form]');
const view = document.querySelector('[data-view]');
const selection = document.querySelector('[data-selection]');

for (const product of PRODUCTS) {
    const label = document.createElement('label');
    label.className = 'tile';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.name = 'icon';
    input.value = product.iconId;
    input.checked = selected.has(product.iconId);
    const check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.textContent = '✓';
    const art = document.createElement('span');
    art.className = 'art';
    art.append(createIconPreview(getIcon(product.iconId)));
    const copy = document.createElement('span');
    copy.className = 'copy';
    copy.innerHTML = `<small>${product.kicker}</small><strong>${product.name}</strong>`;
    label.append(input, check, art, copy);
    grid.append(label);
}

function selectedIds() {
    return [...form.querySelectorAll('input:checked')].map((input) => input.value);
}

function update() {
    const ids = selectedIds();
    view.disabled = ids.length === 0;
    view.textContent = ids.length ? `View selected · ${ids.length}` : 'View selected';
    selection.textContent = ids.length === 0 ? 'No icons selected' : `${ids.length} icon${ids.length === 1 ? '' : 's'} selected`;
}

form.addEventListener('change', update);
form.addEventListener('submit', (event) => {
    event.preventDefault();
    const ids = selectedIds();
    if (ids.length) location.href = `/svg/view?icons=${encodeURIComponent(ids.join(','))}`;
});
update();
window.__ICON3D_CATALOGUE_READY = true;
</script>
</body>
</html>
