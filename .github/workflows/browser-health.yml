name: Browser Health

# The unit suite never loads index.html, so it cannot tell whether the GAME
# works — only whether the extracted modules do. A regression shipped to
# production on 2026-09-06 that left the world rendering perfectly while the
# nesting and collectibles systems were never created: initial environment
# setup caught its own exception and logged a warning, and nothing was
# watching for warnings. Every check in place at the time passed it.
#
# This job runs the real page in a real browser and asserts the game is
# working, not merely painting. It is deliberately short: one start, one
# nested landing, and all five game modes.

on:
  pull_request:
  push:
    # Only the root game. The siblings have their own harnesses and their own
    # rules, and rebuilding a browser for a change to humanoid/ is waste.
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'tools/birb-*.mjs'
      - '.github/workflows/browser-health.yml'

concurrency:
  group: browser-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    # Raised from 12 in Wave 2 to make room for three added birb-quality
    # steps below. Measured on this tree (2026-09-09, single run, local —
    # a CI runner will differ but not by an order of magnitude):
    #   --selftest              ~83s
    #   --check resize-restore  ~26s
    #   --check all             ~33s
    # against the four pre-existing steps this job already ran:
    #   birb-shot --start        ~20s
    #   birb-shot --start --nest ~40s
    #   birb-modes                ~46s
    #   birb-shaders               ~26s
    # (docs/perf/gates/G2c.md §3.3 measured 60s/21s/31s for the same three
    # birb-quality steps on its own run; the numbers move a little between
    # runs on this box, neither set was invented, and both are well inside
    # this budget.) Total added cost is under 2.5 minutes against setup
    # (npm install + Chromium install) that is unmeasured here but was
    # already running comfortably inside the pre-Wave-2 timeout of 12.
    # 24 minutes leaves slack for a slower runner without hiding a real hang.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        # --no-save keeps these out of package.json: the game itself has no
        # dependencies and that is a property worth preserving. Both packages
        # go in ONE command — a second --no-save install prunes the first.
        run: npm install --no-save playwright https-proxy-agent

      - name: Restore the tracked Three stub
        # Any npm install prunes the hand-written stub this repo tracks in
        # node_modules/three, which silently breaks the unit suite.
        run: git checkout -- node_modules/three/index.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # --- Pre-existing game-health checks. These run FIRST, unconditionally,
      # with no continue-on-error: they are the checks this job exists for,
      # and nothing added below may stand between a push and them running.
      # (docs/perf/gates/G2c.md §3.4: Wave 2 shipped these AFTER two red
      # birb-quality steps with no guard, so the job died before reaching
      # any of the four below on every push touching index.html/src/**/sw.js.)

      # Every check below runs even when one above it failed
      # (`if: ${{ !cancelled() }}`); the job still fails if any did. Under the
      # default `success()` one red step skipped everything after it: on main
      # at d47fc7e (run 159) the flight-v2 ground-contact coin toss failed and
      # the shader and quality steps never ran, so that run could not say
      # whether they were green. A failure should report what else broke,
      # not hide it.
      - name: The production default is Ultra, every lever at its ceiling, and a preset switch is reversible
        if: ${{ !cancelled() }}
        # Boots with NO quality flag — the path a player takes — and reads the
        # EFFECTIVE renderer state back: native DPR, VSM 2048, 4x MSAA, post
        # Full, terrain High, anisotropy at the device max. Then Amazing must
        # equal the baseline exactly and Ultra again must equal boot. Every
        # other browser step below boots at `?quality=amazing`, because under
        # SwiftShader an Ultra frame is 2.6 s (docs/perf/gates/G-ULTRA-DEFAULT.md).
        run: node tools/birb-default.mjs

      - name: Game starts and is actually playable
        if: ${{ !cancelled() }}
        # Asserts a rendered frame AND that the nesting and collectibles
        # systems exist, on the plain-start path a player takes. Exits
        # non-zero on any page error or console error.
        run: node tools/birb-shot.mjs --out /tmp/start.png --start --query quality=amazing

      - name: A nest can be landed on
        if: ${{ !cancelled() }}
        run: node tools/birb-shot.mjs --out /tmp/nest.png --start --nest --query quality=amazing

      - name: Every game mode enters, reports sane state and exits
        if: ${{ !cancelled() }}
        # Ring Rush's win condition must equal the spawner's ring count, and
        # Turret Defense must put the player on the gun. Console warnings
        # count as failures: that is how the setup bug announced itself.
        run: node tools/birb-modes.mjs

      - name: The bird can stand, walk, stop, reverse and steer
        if: ${{ !cancelled() }}
        # The grounded state had a walk cycle and walk controls for months
        # and nothing in the repo drove them, so two defects sat in the
        # shipped build: the perch fold targeted `isNested` alone (a bird
        # walking on the ground held the full spread-wing glide) and the
        # walk bob moved along world +Y on a planet where up is radial.
        # Neither is visible in a screenshot of a bird that happens to be
        # flying, and neither is reachable from a unit test — the rig lives
        # in index.html and the state only exists after a real ground
        # collision.
        run: node tools/birb-walk.mjs

      - name: The stunt flight model is the default, and the Boost pill is a pad
        if: ${{ !cancelled() }}
        # docs/realism/STUNT_FLIGHT_PLAN.md, gate G-STUNT-0. This step boots
        # with NO flight flag on purpose: its first assertion is that the
        # PRODUCTION DEFAULT is the stunt model, which a run passing
        # `?flight=stunt` could not tell you. It then proves the WIRING, which
        # is where flight features in this repo actually break — the pad
        # reaching the controller, the cruise handover going to the right
        # property, the camera hold landing on the LIVE rig rather than the
        # parked one, and a tap on the pill still boosting. Console warnings
        # are failures.
        run: node tools/birb-stunt.mjs

      - name: Flight v2 rolls, loops, turns from the bank, rights itself and crashes inverted
        if: ${{ !cancelled() }}
        # docs/realism/FLIGHT_V2_PLAN.md's `?flight=v2`: bank-to-turn instead
        # of yaw-with-cosmetic-bank, unlimited pitch instead of an 80° clamp,
        # and an energy model instead of a constant cruise speed. The FIRST
        # thing this checks is that the flag reached a v2 controller at
        # all — the default stunt model already rolls and loops, so a
        # silently-ignored flag would pass a bank/loop check for the wrong
        # reason. Everything after that drives `setStick`/
        # `setAltitude` and reads `flightProbe()` on the live page, frame by
        # frame (SwiftShader is too slow for this at the Ultra default, so
        # this step — like birb-walk above — boots `?quality=amazing`).
        run: node tools/birb-flight-v2.mjs

      - name: Every shader compiles, in every environment
        if: ${{ !cancelled() }}
        # Three logs a shader error and then quietly draws NOTHING for that
        # material, so the page still renders and a screenshot still exits
        # zero. Two systems shipped invisible this way in one session — the
        # weather (a variable named `half`, reserved in GLSL ES) and the
        # city's entire ground (a varying declared twice). Every biome is
        # visited because a material that lives in one of them is exactly the
        # kind nothing else covers.
        run: node tools/birb-shaders.mjs

      # --- Wave 2 quality-assertion checks. Added after the four steps
      # above on purpose (see the comment block at the top of this list).

      - name: Quality harness initializes; two capturers are still missing (Wave 2R)
        if: ${{ !cancelled() }}
        # Boots a game, installs the 25 catalogued mutations and reads
        # telemetry from __BIRB.effective(). Measured on this tree: 23 of 25
        # mutations are detected; two (M-A1-gesture-behind-debug and
        # M-A2-panel-opens-on-any-touch) report their target file as present
        # on disk but have no live capturer wired to verify them, so the
        # harness itself exits non-zero even though initialization otherwise
        # succeeds. continue-on-error until the task that ships each
        # capturer lands alongside it — Wave 2R — at which point remove this
        # and let a regression here fail the job again.
        run: node tools/birb-quality.mjs --selftest
        continue-on-error: true

      - name: Resize-restore bug is fixed and must stay fixed
        if: ${{ !cancelled() }}
        # A6 asserts that tier restoration without a canvas resize leaves
        # bloom and weather targets desynchronized. That bug is what
        # docs/perf/EXPECTED-RED.md originally described as permanent.
        # Measured on this tree: A6 now PASSES — restoredCoherent: true,
        # zero mismatches at every step — because Wave 2 fixed it
        # (updateRendererSize(true)); docs/perf/gates/G2b.md confirmed the
        # fix is load-bearing by reverting the one-line change and watching
        # the same check go red again. This step is therefore NOT
        # expected-red: it must exit 0, and a future exit 1 here is a real
        # regression of the fix, not the documented bug reasserting itself.
        run: node tools/birb-quality.mjs --check resize-restore

      - name: Every quality assertion passes
        if: ${{ !cancelled() }}
        # Runs all twelve assertions. Measured on this tree: A4, A6, A7, A8,
        # A9 pass. A1, A2, A3, A5, A10, A11, A12 report their target file as
        # present on disk (src/ui/dev-quality-panel.js, src/ui/dev-gesture.js,
        # __BIRB.quality()) but have no live capturer yet, so they fail for
        # want of one rather than because the feature regressed. This is not
        # the same claim EXPECTED-RED.md made about A6 (see the step above) —
        # A6 is excluded from that list because it is implemented and
        # capturers; remove it then so a real regression in A4/A6/A7/A8/A9
        # fails the job.
        # Wave 2R wired the seven missing capturers (tools/lib/quality-captures.mjs)
        # and gave A6 an isolated page, so all twelve assertions now report a real
        # verdict and the board exits 0. This is a HARD gate from here: with
        # continue-on-error a regression in any of the twelve would be tolerated
        # silently, which is the failure mode this programme exists to prevent.
        run: node tools/birb-quality.mjs --check all

      - name: Upload frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-frames
          path: /tmp/*.png
          if-no-files-found: ignore
