name: Phase 4 Harness Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase4-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install harness packages
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright three-real@npm:three@0.183.2
          git checkout -- node_modules/three/index.js
          tar -czf /tmp/phase4-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-node-modules
          path: /tmp/phase4-node-modules.tar.gz
          retention-days: 1
