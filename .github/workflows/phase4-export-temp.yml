name: Phase 4 Chromium Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase4-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install harness and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright three-real@npm:three@0.183.2
          git checkout -- node_modules/three/index.js
          npx playwright install chromium
          tar -czf /tmp/phase4-chromium.tar.gz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-chromium
          path: /tmp/phase4-chromium.tar.gz
          retention-days: 1
