name: humanoid

on:
  push:
    paths: ['humanoid/**', '.github/workflows/humanoid.yml']
  pull_request:
    paths: ['humanoid/**', '.github/workflows/humanoid.yml']
  workflow_dispatch:

concurrency:
  group: humanoid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a Mac. This is the real gate: the exporters,
  # the rig checks and all three independent oracles run here.
  linux:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq zlib1g-dev python3 curl xz-utils \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6

      - name: Unit tests
        working-directory: humanoid
        run: swift test

      - name: Golden corpus
        working-directory: humanoid
        run: swift run humanoid-cli corpus .build/corpus

      - name: Khronos glTF validator
        working-directory: humanoid
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
          apt-get install -y -qq nodejs
          # `npm init` first, and it is not ceremony. With no package.json in
          # this directory npm walks UP to the nearest one — the game's, at the
          # repository root — and installs there, so the require() below found
          # nothing and this step failed on every push from 2026-09-19 on,
          # skipping every check after it.
          mkdir -p .build/gltf && cd .build/gltf && npm init -y >/dev/null && npm install --silent gltf-validator
          cd "$GITHUB_WORKSPACE/humanoid"
          # The clay exports are GLB, not VRM, and they are the files the app
          # ships today; validating only *.vrm left them unchecked.
          for f in .build/corpus/*.vrm .build/corpus/*.glb; do
            node -e "
              const v=require('$PWD/.build/gltf/node_modules/gltf-validator'), fs=require('fs');
              v.validateBytes(new Uint8Array(fs.readFileSync('$f'))).then(r=>{
                const i=r.issues;
                if (i.numErrors || i.numWarnings) {
                  i.messages.filter(m=>m.severity<=1).forEach(m=>console.error(m.code+' @ '+m.pointer+': '+m.message));
                  process.exit(1);
                }
                console.log('$f ok');
              });"
          done

      - name: Embedded PNG decodes
        working-directory: humanoid
        run: python3 tools/check_glb_png.py .build/corpus/*.vrm .build/corpus/*.glb

      # Independent re-derivation of the shipped body from its own bytes. The
      # baker's T-pose report measures head-to-tail of bones it has just aimed,
      # so it reads 0.00 degrees whatever the body did; this measures head to
      # CHILD head, which is what Unity's mapper scores.
      - name: Shipped templates
        working-directory: humanoid
        run: |
          python3 tools/check_template.py Sources/HumanoidCore/Resources/clay-v1.bin
          python3 tools/check_template.py Sources/HumanoidCore/Resources/body-v1.bin

      # Both bakers must reproduce what is committed. A template that no longer
      # matches its generator is one nobody can regenerate.
      - name: Clay template is reproducible
        working-directory: humanoid
        run: |
          python3 tools/build_clay.py --out /tmp/clay-check.bin
          cmp /tmp/clay-check.bin Sources/HumanoidCore/Resources/clay-v1.bin

      # Blender is a large download, so it runs on the default branch and on
      # demand rather than on every pull-request push.
      - name: Blender import oracles
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: humanoid
        run: |
          curl -fsSL -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          mkdir -p /tmp/blender && tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          # No pipe to grep: the oracles print their result line whatever they
          # found, and piping hands the step grep's exit code instead of
          # Blender's, so every file passed including rejected ones.
          for f in .build/corpus/*.vrm .build/corpus/*.glb; do
            /tmp/blender/blender --factory-startup --background \
              --python tools/blender_check_vrm.py -- "$f"
          done
          for f in .build/corpus/*.fbx; do
            /tmp/blender/blender --factory-startup --background \
              --python tools/blender_check_fbx.py -- "$f"
          done
          # The exported texture read the way a consumer reads it: the paint
          # has to be on the face it was painted on.
          /tmp/blender/blender --factory-startup --background \
            --python tools/blender_check_paint.py -- .build/corpus/clay-sculpted.glb
          # A picture of the exported file. Everything above proves the container
          # and the rig; none of it can tell a body from valid triangles.
          /tmp/blender/blender --factory-startup --background \
            --python tools/blender_render_vrm.py -- \
            .build/corpus/neutral.vrm .build/corpus/neutral
          /tmp/blender/blender --factory-startup --background \
            --python tools/blender_render_vrm.py -- \
            .build/corpus/clay-neutral.glb .build/corpus/clay-neutral
          /tmp/blender/blender --factory-startup --background \
            --python tools/blender_render_vrm.py -- \
            .build/corpus/clay-sculpted.glb .build/corpus/clay-sculpted

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humanoid-corpus
          path: humanoid/.build/corpus/

  # Proves the Xcode side stays buildable without anyone opening Xcode. The
  # physical-device run is still a human step; this catches everything before it.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Package tests on Apple platforms
        working-directory: humanoid
        run: swift test

      - name: Generate the Xcode project
        working-directory: humanoid/app
        run: |
          brew install xcodegen
          xcodegen generate

      # This step used to pass in two seconds without compiling anything. It
      # named `Humanoid.xcodeproj` and a `HumanoidApp` scheme, which stopped
      # existing when the product became Baby Blender, and it piped xcodebuild
      # into xcpretty under the default `bash -e` — no pipefail — so the step
      # took xcpretty's exit status: "'Humanoid.xcodeproj' does not exist",
      # then green. The iPad app had never once been compiled by CI.
      #
      # Built for a DEVICE, in Release, because that is what goes on the iPad:
      # the optimiser is where a Release-only error lives, and a device build
      # needs only the SDK that ships inside Xcode, not a simulator runtime.
      - name: Build the iPad app
        working-directory: humanoid/app
        shell: bash
        run: |
          set -euo pipefail
          # Xcode 26 ships the Metal compiler as a separate download. Without
          # it Shaders.metal fails with "missing Metal Toolchain" and the whole
          # default library goes with it.
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -version
          for configuration in Release Debug; do
            echo "::group::$configuration"
            xcodebuild build -quiet \
              -project BabyBlender.xcodeproj \
              -scheme BabyBlender \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
            echo "::endgroup::"
          done
