name: Node Tests

on:
  pull_request:
  push:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run harness and unit tests
        run: npm test
      - name: Run performance-instrumented tests
        # The BIRB_PERF_IMPL environment variable enables the Wave 2 quality-assertion
        # test suites. They are not yet fully green (one failing test in FS-A1b),
        # so this step continues on error. Wave 2 (P2.1–P2.4) will complete them.
        # Once fully green, remove continue-on-error and integrate these into the
        # base test suite.
        run: BIRB_PERF_IMPL=1 npm test
        continue-on-error: true
