name: Node Tests

on:
  pull_request:
  push:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run harness and unit tests
        run: npm test
      - name: Run performance-instrumented tests
        # The BIRB_PERF_IMPL environment variable enables the Wave 2 quality-assertion
        # test suites. FS-A1b (the percentile-implementation defect docs/perf/gates/G2a.md
        # and G2c.md tracked across three gates) is fixed and passing as of this wave.
        # Measured on this tree it is not yet fully green regardless — remaining
        # failures are in-flight elsewhere in this same wave (Wave 2R) and are not this
        # step's concern to fix — so this step still continues on error. Once the full
        # BIRB_PERF_IMPL suite is green, remove continue-on-error and fold these into
        # the base `npm test` step above instead of running the suite twice.
        run: BIRB_PERF_IMPL=1 npm test
        continue-on-error: true
