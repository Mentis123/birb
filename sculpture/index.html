<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1118">
<title>Bronze — a Birb Labs study</title>
<style>
  :root {
    --ink: #0d1118;
    --cream: #ece7dc;
    --dim: #8d8779;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--cream);
    overflow: hidden;
    font-family: ui-rounded, "Avenir Next", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #stage { position: fixed; inset: 0; }

  .chrome {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(env(safe-area-inset-top, 0px), 14px) 16px
             max(env(safe-area-inset-bottom, 0px), 14px);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .title {
    font-size: 11px; font-weight: 800; letter-spacing: 0.34em;
    text-transform: uppercase; opacity: 0.72;
  }
  .title b { display: block; font-size: 17px; letter-spacing: 0.16em; opacity: 1; margin-top: 3px; }
  .hint {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim); text-align: center;
    transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }

  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--ink); z-index: 10;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim);
    transition: opacity 0.5s ease;
  }
  .loading.gone { opacity: 0; pointer-events: none; }

  .fatal {
    position: fixed; inset: 0; z-index: 500; display: none;
    align-items: center; justify-content: center; padding: 2rem; text-align: center;
    background: var(--ink); font-size: 13px; line-height: 1.6;
  }
  .fatal.on { display: flex; }
</style>
</head>
<body>

<div id="stage"><canvas id="scene"></canvas></div>

<div class="chrome">
  <div class="title">Birb Labs · study<b>Bronze</b></div>
  <div class="hint" data-hint>Drag to turn · pinch to zoom · double-tap to reset</div>
</div>

<div class="loading" data-loading>Casting…</div>
<div class="fatal" data-fatal></div>

<script type="module">
import { loadThree } from '/sculpture/src/core/three-loader.js';
import { createSculpture, createLightRig } from '/sculpture/src/model/sculpture.js';
import { createOrbit } from '/sculpture/src/view/orbit.js';
import { createQrOverlay } from '/sculpture/src/ui/qr-overlay.js';

const fatalEl = document.querySelector('[data-fatal]');
function fatal(err) {
    fatalEl.textContent = 'This study could not be cast. ' + (err && err.message ? err.message : err);
    fatalEl.classList.add('on');
    // eslint-disable-next-line no-console
    console.error(err);
}

// Three-finger QR, same Birb Labs convention as Gauntlet, pinned to production.
createQrOverlay({
    url: 'https://birbmobile.vercel.app/sculpture',
    label: 'birbmobile.vercel.app/sculpture',
    kicker: 'Scan to view',
});

(async function boot() {
    const THREE = await loadThree();

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;

    const scene = new THREE.Scene();
    // A pale studio backdrop. The first pass used the page's near-black and
    // the bronze vanished into it — this is a study of a dark object, so the
    // ground it sits on has to be lighter than it is.
    scene.background = new THREE.Color(0x59647a);
    // A shallow fog pulls the far side of the group back and keeps the mass
    // readable when you orbit behind it.
    scene.fog = new THREE.Fog(0x59647a, 11, 30);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

    createLightRig(THREE, scene);

    const sculpture = createSculpture(THREE);
    scene.add(sculpture.group);

    // Ground: a large disc catching the shadow, dark enough to read as the
    // gallery floor rather than as pavement — this is a study of the object,
    // not a reconstruction of the forecourt.
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x6d7688, roughness: 0.96, metalness: 0.0,
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // The group is 2.42m tall, so the orbit target sits at its middle rather
    // than at eye height.
    const orbit = createOrbit(camera, canvas, { targetY: 1.30, distance: 7.0, maxDistance: 15 });

    function resize() {
        const w = innerWidth, h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        orbit.invalidate();
    }
    addEventListener('resize', resize);
    resize();

    // Fade the gesture hint once the viewer has clearly worked it out.
    const hint = document.querySelector('[data-hint]');
    let touched = false;
    canvas.addEventListener('pointerdown', () => {
        if (touched) return;
        touched = true;
        setTimeout(() => hint.classList.add('gone'), 900);
    }, { once: false });

    document.querySelector('[data-loading]').classList.add('gone');

    let last = performance.now();
    let frames = 0, fpsAccum = 0, fps = 60;

    function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        fpsAccum += dt; frames++;
        if (fpsAccum >= 0.5) { fps = frames / fpsAccum; frames = 0; fpsAccum = 0; }

        // Render on demand. A still sculpture costs nothing.
        if (orbit.update(dt)) renderer.render(scene, camera);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // --- harness hooks -----------------------------------------------------
    window.__SCULPT = {
        THREE, renderer, scene, camera, orbit, sculpture,
        /** Park the camera at an exact view and render it immediately. */
        setView(yawDeg, pitchDeg, distance) {
            orbit.setView(yawDeg * Math.PI / 180, pitchDeg * Math.PI / 180, distance, true);
            orbit.update(0);
            renderer.render(scene, camera);
        },
    };
    window.__SCULPT_STATS = () => ({
        drawCalls: renderer.info.render.calls,
        triangles: renderer.info.render.triangles,
        fps: Math.round(fps),
        figures: sculpture.figures.length,
        yaw: Math.round(orbit.yaw * 180 / Math.PI),
        pitch: Math.round(orbit.pitch * 180 / Math.PI),
        distance: Math.round(orbit.distance * 100) / 100,
    });
    window.__SCULPT_READY = true;
})().catch(fatal);
</script>
</body>
</html>
