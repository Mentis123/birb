<!DOCTYPE html>
<!--
  probe-parts.html — ONE figure, any subset of its parts, in isolation.

  WHY IT EXISTS. Rendering the body without the cloak in front of it is the only
  way to tell "the torso is wrong" from "the torso is hidden", and this model was
  debugged the wrong way round for several passes before this page existed: the
  bust, belly, arms and shoulders were all correct and none of them was visible,
  because the cloak's front opening was a fifth of the size it should have been.

  Query parameters, all optional:
    ?only=shell,body,head,feet   which parts to build   (default: all four)
    &pregnant &baby &steth       which story this figure carries
    &hair=none|cap|capbun        head treatment                 (default: cap)
    &weightShift=-0.11           settle the column over one foot
    &material=normal             normal diagnostic instead of lit bronze
    &side=front                  FrontSide material, to expose culling and holes
                                 (default DoubleSide, which hides inverted winding)
    &three=local                 use node_modules Three instead of the CDN

  Drive it with the same harness as the main page, which fails the run on any
  page or console error:

    node tools/sculpture-shot.mjs --page sculpture/dev/probe-parts.html \
      --out shots/sculpt/probe.png --query "three=local&only=body,head&side=front" \
      --w 620 --h 800 --dpr 2 --wait 60000 \
      --eval "window.__PROBE.setView(-12, 4, 1.9, 1.45)"   // yaw, pitch, dist, targetY

  The lighting here is deliberately flat and frontal so you are looking at FORM,
  not at the scene's key. Do not judge patina, contrast or relief-under-raking-
  light from this page — use tools/sculpture-sheet.mjs for anything about light.
-->
<html><head><meta charset="utf-8"><title>probe parts</title>
<style>html,body{margin:0;height:100%;background:#59647a;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
import { loadThree } from '/sculpture/src/core/three-loader.js';
import * as FIG from '/sculpture/src/model/figure.js';

const THREE = await loadThree();
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x59647a);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.05, 60);
scene.add(new THREE.HemisphereLight(0xbcd8f5, 0x8b8271, 2.0));
const d = new THREE.DirectionalLight(0xfff4e2, 2.6); d.position.set(-3,4,5); scene.add(d);
const d2 = new THREE.DirectionalLight(0xcae2ff, 1.2); d2.position.set(4,2,-4); scene.add(d2);

const Q = new URLSearchParams(location.search);
const side = Q.get('side') === 'front' ? THREE.FrontSide : THREE.DoubleSide;
const mat = Q.get('material') === 'normal'
    ? new THREE.MeshNormalMaterial({ side })
    : new THREE.MeshStandardMaterial({
        color: 0x8a8f80, roughness: 0.7, metalness: 0.15, side,
    });
const o = { seed: 37, hair: Q.get('hair') || 'cap', faceless: false,
            pregnant: Q.has('pregnant'), baby: Q.has('baby'), stethoscope: Q.has('steth'),
            weightShift: Number(Q.get('weightShift') || 0),
            folds: 6, foldDepth: 1.12, foldPhase: 3.1, trainAngle: 2.52, trainAmount: 0.38, scale: 1 };

// Rebuild the parts individually via the module's own internals by asking for a
// full figure and, separately, a figure with the shell suppressed.
const shown = {};
window.__PROBE = { THREE, scene, renderer, camera, shown };

// body + head + feet only
const bodyOnly = FIG.buildFigure(THREE, { ...o, only: (Q.get('only') || 'shell,body,head,feet').split(',') });
const mesh = new THREE.Mesh(bodyOnly, mat);
scene.add(mesh);
window.__PROBE.shown.figure = mesh;

function setView(yawDeg, pitchDeg, dist, ty) {
    const y = yawDeg*Math.PI/180, p = pitchDeg*Math.PI/180;
    camera.position.set(Math.sin(y)*Math.cos(p)*dist, ty + Math.sin(p)*dist, Math.cos(y)*Math.cos(p)*dist);
    camera.lookAt(0, ty, 0);
    renderer.render(scene, camera);
}
window.__PROBE.setView = setView;
setView(0, 0, 3.2, 1.5);
window.__SCULPT_READY = true;
</script></body></html>
