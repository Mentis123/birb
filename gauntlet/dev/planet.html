<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birb Gauntlet dev · planet</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1324; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 2;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: #fff6dc; text-shadow: 0 1px 2px #0f1c33;
    pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
import { loadThree } from '/gauntlet/src/core/three-loader.js';
import { PALETTE } from '/gauntlet/src/core/palette.js';
import { createLightRig } from '/gauntlet/src/core/toon.js';
import { floorRadius, PLANET_RADIUS } from '/gauntlet/src/core/terrain.js';
import { createPlanet } from '/gauntlet/src/world/planet.js';

const THREE = await loadThree();
const P = new URLSearchParams(location.search);

// view=low   -> bird altitude, looking along the surface (THE view to judge)
// view=space -> whole planet, to check biome distribution only
const view = P.get('view') || 'low';
const quality = P.get('quality') || 'high';
const th = parseFloat(P.get("th") ?? "4.40");
const ph = parseFloat(P.get("ph") ?? "0.35");
const alt = parseFloat(P.get("alt") ?? "9.0");

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
// Aerial perspective. Without it the far side of a 100-unit planet has the
// same contrast as the foreground and the frame reads flat.
scene.fog = new THREE.Fog(PALETTE.fog, 45, 200);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.5, 3000);
createLightRig(THREE, scene);

// --- stand-in sky (sky.js belongs to another agent; this is probe-local) ---
const skyGeo = new THREE.SphereGeometry(1200, 24, 16);
const skyPos = skyGeo.getAttribute('position');
const skyCol = new Float32Array(skyPos.count * 3);
const zen = new THREE.Color(PALETTE.skyZenith);
const mid = new THREE.Color(PALETTE.skyMid);
const hor = new THREE.Color(PALETTE.skyHorizon);
const tmpC = new THREE.Color();
for (let i = 0; i < skyPos.count; i++) {
  const t = THREE.MathUtils.clamp(skyPos.getY(i) / 1200 * 0.5 + 0.5, 0, 1);
  if (t < 0.5) tmpC.copy(hor).lerp(mid, t / 0.5);
  else tmpC.copy(mid).lerp(zen, (t - 0.5) / 0.5);
  skyCol[i * 3] = tmpC.r; skyCol[i * 3 + 1] = tmpC.g; skyCol[i * 3 + 2] = tmpC.b;
}
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyCol, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({
  vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false,
}));
sky.renderOrder = -10;
scene.add(sky);

// --- the subsystem under test ---------------------------------------------
const planet = createPlanet(THREE, { quality, seed: 20260801 });
scene.add(planet.group);

// --- camera placement ------------------------------------------------------
const dir = new THREE.Vector3(
  Math.cos(ph) * Math.cos(th),
  Math.sin(ph),
  Math.cos(ph) * Math.sin(th)
).normalize();

const fwd = new THREE.Vector3();
const lookAt = new THREE.Vector3();
const ahead = new THREE.Vector3();

function placeCamera() {
  if (view === 'space') {
    camera.position.set(dir.x, dir.y, dir.z).multiplyScalar(300);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    scene.fog.near = 260; scene.fog.far = 620;
    return;
  }
  const up = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  fwd.copy(up).cross(dir).normalize();

  camera.position.copy(dir).multiplyScalar(floorRadius(dir.x, dir.y, dir.z) + alt);
  // Aim along the surface so the horizon sits in the upper third. A tall
  // portrait frame at the same pitch is over half empty sky, so aim lower as
  // the aspect narrows — the same correction the chase camera will need.
  const portrait = Math.min(1, Math.max(0, (1.0 - innerWidth / innerHeight) / 0.5));
  const reach = 0.24 - 0.055 * portrait;
  ahead.copy(dir).addScaledVector(fwd, reach).normalize();
  lookAt.copy(ahead).multiplyScalar(floorRadius(ahead.x, ahead.y, ahead.z) + 1.5 - 1.2 * portrait);
  camera.up.copy(dir);
  camera.lookAt(lookAt);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  placeCamera();
}
addEventListener('resize', resize);
resize();

// One deterministic time offset so the sway pose is identical every capture.
planet.update(1.7, view === 'space' ? 0 : dir.x, view === 'space' ? 0 : dir.y, view === 'space' ? 0 : dir.z);
renderer.render(scene, camera);

const stats = {
  drawCalls: renderer.info.render.calls,
  triangles: renderer.info.render.triangles,
};
document.getElementById('hud').textContent =
  `view=${view} quality=${quality}\n` +
  `draws=${stats.drawCalls}  tris=${stats.triangles}\n` +
  `built: draws=${planet.drawCallCount} tris=${planet.triangleCount}\n` +
  `R=${PLANET_RADIUS} alt=${alt}\n` + JSON.stringify(planet.layerCounts);

window.__planet = planet;
const triCount = (g) => (g.getIndex() ? g.getIndex().count : g.getAttribute('position').count) / 3;
window.__GAUNTLET_STATS = () => {
  const layers = {};
  planet.propLayers.forEach((m) => {
    const per = triCount(m.geometry);
    layers[m.name.replace('gauntlet-prop-', '')] = { per, count: m.count, tris: per * m.count };
  });
  return {
    drawCalls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
    builtDrawCalls: planet.drawCallCount,
    builtTriangles: planet.triangleCount,
    terrainTris: triCount(planet.terrain.geometry),
    layers,
  };
};
window.__GAUNTLET_READY = true;
</script>
</body>
</html>
