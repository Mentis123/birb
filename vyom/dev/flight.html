<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYOM dev · flight + chase camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1324; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 2;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    color: #fff6dc; text-shadow: 0 1px 3px #0f1c33;
    pointer-events: none; white-space: pre;
  }
  .bad { color: #ff8a6b; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
/**
 * Probe for bird/flight.js + camera/chase-camera.js.
 *
 * This page does not render a live game. It runs the flight controller
 * headlessly along a SCRIPTED input sequence at a fixed timestep, records the
 * trajectory, and then draws that trajectory as a ribbon so the spherical
 * behaviour is visible in a single still frame:
 *
 *   - does the path actually wrap the planet, or does it fly off in a fixed
 *     world direction (the original Birb Mobile bug)?
 *   - does it descend INTO the carved valleys?
 *   - does it ever clip through the floor, or ratchet upward over hills?
 *
 * The same run also asserts those invariants numerically. Any failure is
 * written to the console as an error, which makes the screenshot harness exit
 * non-zero — so a green capture is a real pass, not a pretty picture.
 */
import { loadThree } from '/vyom/src/core/three-loader.js';
import { PALETTE } from '/vyom/src/core/palette.js';
import { createToonMaterial, createLightRig } from '/vyom/src/core/toon.js';
import { attachOutlineTree, updateOutlineProjection, outlineShared } from '/vyom/src/core/outline.js';
import { PLANET_RADIUS, continentalHeight, floorRadius } from '/vyom/src/core/terrain.js';
import { createPlanet } from '/vyom/src/world/planet.js';
import { VyomFlight, FLIGHT_CONFIG, FLIGHT_STATE, floorRadiusAt } from '/vyom/src/bird/flight.js';
import { createChaseCamera } from '/vyom/src/camera/chase-camera.js';

const THREE = await loadThree();
const P = new URLSearchParams(location.search);
const view = P.get('view') || 'chase';          // chase | orbit
const quality = P.get('quality') || 'high';
const DURATION = parseFloat(P.get('t') ?? '46');
// The sim always runs the full DURATION for the invariants, but the RENDERED
// moment is `stop`: the camera and the trail freeze there, so the hero frame is
// a chosen beat instead of "wherever the script happened to end".
const STOP = parseFloat(P.get('stop') ?? '24');
const DT = 1 / 60;
const BIRD_RADIUS = 1.3;

// ---------------------------------------------------------------------------
// renderer / scene
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PALETTE.fog, 55, 230);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 3000);
createLightRig(THREE, scene);

// Probe-local sky (sky.js belongs to another agent).
const skyGeo = new THREE.SphereGeometry(1400, 24, 16);
const skyPos = skyGeo.getAttribute('position');
const skyCol = new Float32Array(skyPos.count * 3);
const zen = new THREE.Color(PALETTE.skyZenith);
const mid = new THREE.Color(PALETTE.skyMid);
const hor = new THREE.Color(PALETTE.skyHorizon);
const tmpC = new THREE.Color();
for (let i = 0; i < skyPos.count; i++) {
  const t = Math.min(1, Math.max(0, skyPos.getY(i) / 1400 * 0.5 + 0.5));
  if (t < 0.5) tmpC.copy(hor).lerp(mid, t / 0.5);
  else tmpC.copy(mid).lerp(zen, (t - 0.5) / 0.5);
  skyCol[i * 3] = tmpC.r; skyCol[i * 3 + 1] = tmpC.g; skyCol[i * 3 + 2] = tmpC.b;
}
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyCol, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({
  vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false,
}));
sky.renderOrder = -10;
scene.add(sky);

const planet = createPlanet(THREE, { quality, seed: 20260801 });
scene.add(planet.group);

// ---------------------------------------------------------------------------
// stand-in bird (bird-model.js belongs to another agent) — faces -Z, up +Y
// ---------------------------------------------------------------------------
function makeStandInBird() {
  const g = new THREE.Group();
  const skin = createToonMaterial(THREE, { color: PALETTE.birdPlayer, ramp: 'hero' });
  const belly = createToonMaterial(THREE, { color: PALETTE.birdPlayerBelly, ramp: 'hero' });
  const beakMat = createToonMaterial(THREE, { color: PALETTE.beak, ramp: 'hero', flatShading: true });

  const body = new THREE.Mesh(new THREE.SphereGeometry(1.05, 18, 14), skin);
  body.scale.set(1, 0.95, 1.35);
  g.add(body);

  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.72, 14, 11), belly);
  chest.position.set(0, -0.24, -0.42);
  chest.scale.set(1, 0.8, 1.05);
  g.add(chest);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.74, 16, 12), skin);
  head.position.set(0, 0.5, -1.1);
  g.add(head);

  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.85, 6), beakMat);
  beak.position.set(0, 0.34, -1.82);
  beak.rotation.x = -Math.PI / 2;
  g.add(beak);

  for (const side of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.6, 5), skin);
    wing.position.set(side * 0.85, 0.10, 0.15);
    // Near-horizontal with a slight upward dihedral and a backward sweep —
    // a gliding delta. Tilted down at the tip the cones read as mandibles;
    // flat in plane they read as a bowtie. This is the readable middle.
    wing.rotation.set(0.0, side * -0.62, side * (Math.PI * 0.5 - 0.14));
    wing.scale.set(1, 1, 0.3);
    g.add(wing);
  }

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 4), skin);
  tail.position.set(0, 0.16, 1.5);
  tail.rotation.x = -Math.PI / 2;
  tail.scale.set(1, 1, 0.32);
  g.add(tail);

  attachOutlineTree(THREE, g, { color: PALETTE.ink, pixels: 2.6, maxPush: 1.2 });
  return g;
}
const bird = makeStandInBird();
scene.add(bird);

// ---------------------------------------------------------------------------
// the subsystems under test
// ---------------------------------------------------------------------------
const startDir = new THREE.Vector3(0.15, 0.42, 0.9).normalize();
const startPos = startDir.clone().multiplyScalar(PLANET_RADIUS + 9);

function newFlight() {
  const f = new VyomFlight(THREE, {
    sphereRadius: PLANET_RADIUS,
    terrainHeightAt: continentalHeight,
    birdRadius: BIRD_RADIUS,
    position: startPos,
  });
  f.setHeading(0, 1, 0);   // head "north" from the spawn point
  return f;
}
const flight = newFlight();

const chase = createChaseCamera(THREE, camera, {
  quality, renderer,
  terrainHeightAt: continentalHeight,
  sphereRadius: PLANET_RADIUS,
});
chase.setMode(view === 'orbit' ? 'chase' : 'chase');

// ---------------------------------------------------------------------------
// scripted input — one deterministic flight, no RNG, no wall clock
// ---------------------------------------------------------------------------
const input = { x: 0, y: 0, boost: false };
const KNOCK_AT = parseFloat(P.get('knock') ?? '19.5');   // <0 disables

function script(t) {
  // Smooth, continuous stick so the path reads as flying rather than as a
  // sequence of jump-cuts. Two incommensurate sines per axis give a wandering
  // line that still covers the planet.
  input.x = 0.72 * Math.sin(t * 0.23) + 0.30 * Math.sin(t * 0.67 + 0.9);
  input.y = 0.82 * Math.sin(t * 0.37 + 1.15);
  input.boost = (t > 13 && t < 16.6) || (t > 31 && t < 34.8);
  if (input.x > 1) input.x = 1; else if (input.x < -1) input.x = -1;
}

// ---------------------------------------------------------------------------
// run the sim, record the trajectory, check the invariants
// ---------------------------------------------------------------------------
const steps = Math.round(DURATION / DT);
const SAMPLE_EVERY = 3;
const path = [];
const dirA = new THREE.Vector3();
const dirB = new THREE.Vector3();
const localUp = new THREE.Vector3();
const radial = new THREE.Vector3();
const fwd = new THREE.Vector3();
const camDir = new THREE.Vector3();

let minClearance = Infinity;
let minCamClearance = Infinity;
let minRadius = Infinity;
let maxRadius = -Infinity;
let angleTravelled = 0;
let worstRoll = 0;
let worstPitchAbs = 0;
let sawTumble = false;
let sawRelaunch = false;
let shakeAmt = 0;
let knocked = false;
let maxSpeedSeen = 0, minSpeedSeen = Infinity, maxBoostSeen = 0;
const frozen = { speed: 0, boost: 0, speed01: 0 };

dirB.copy(flight.position).normalize();

for (let i = 0; i < steps; i++) {
  const t = i * DT;
  script(t);
  if (KNOCK_AT > 0 && !knocked && t >= KNOCK_AT) { flight.applyKnockdown(); knocked = true; }

  dirA.copy(dirB);
  const pose = flight.tick(input, DT);
  dirB.copy(pose.position).normalize();
  angleTravelled += Math.acos(Math.min(1, Math.max(-1, dirA.dot(dirB))));

  // --- invariants -------------------------------------------------------
  radial.copy(pose.position);
  const r = radial.length();
  radial.multiplyScalar(1 / r);
  const floor = floorRadiusAt(PLANET_RADIUS, continentalHeight(radial.x, radial.y, radial.z), BIRD_RADIUS);
  const clearance = r - floor;
  if (clearance < minClearance) minClearance = clearance;
  if (r < minRadius) minRadius = r;
  if (r > maxRadius) maxRadius = r;

  // Roll / pitch are only meaningful under control — a tumble is SUPPOSED to
  // be inverted, that is the whole point of a committed knockdown.
  // NOTE: the upright metric is ROLL (radial vs the bird's own right vector),
  // not localUp-dot-radial. The latter is just cos(pitch), so a legitimate
  // steep dive would read as a failure.
  if (flight.state !== FLIGHT_STATE.TUMBLING) {
    localUp.set(1, 0, 0).applyQuaternion(pose.quaternion);
    const rollSin = Math.abs(localUp.dot(radial));
    if (rollSin > worstRoll) worstRoll = rollSin;

    fwd.set(0, 0, -1).applyQuaternion(pose.quaternion);
    const pa = Math.abs(fwd.dot(radial));
    if (pa > worstPitchAbs) worstPitchAbs = pa;
  }
  if (flight.state === FLIGHT_STATE.TUMBLING) sawTumble = true;
  if (flight.impacted) sawRelaunch = true;
  if (flight.impacted) shakeAmt = 0.9;

  if (flight.speed > maxSpeedSeen) maxSpeedSeen = flight.speed;
  if (flight.speed < minSpeedSeen) minSpeedSeen = flight.speed;
  if (flight.boost01 > maxBoostSeen) maxBoostSeen = flight.boost01;

  // --- camera, driven exactly as the game will drive it -----------------
  if (t <= STOP) {
    shakeAmt *= Math.exp(-6 * DT);
    chase.update(DT, pose.position, pose.quaternion, flight.speed01, shakeAmt);
    const cr = camera.position.length();
    camDir.copy(camera.position).multiplyScalar(1 / cr);
    minCamClearance = Math.min(minCamClearance,
      cr - (PLANET_RADIUS + Math.min(0, continentalHeight(camDir.x, camDir.y, camDir.z))));
    if (i % SAMPLE_EVERY === 0) path.push(pose.position.clone());
    bird.position.copy(pose.position);
    bird.quaternion.copy(pose.quaternion);
    frozen.speed = flight.speed;
    frozen.boost = flight.boost01;
    frozen.speed01 = flight.speed01;
  }
}

// --- extra headless runs for the invariants a single flight can't show ----

// (a) NO UPWARD RATCHET. Level flight (zero pitch input) over rolling ground
//     must never gain altitude. This is the failure mode a floor that could
//     rise above the baseline would cause.
const ratchet = (() => {
  const f = newFlight();
  const start = f.position.length();
  let peak = start;
  const inp = { x: 0.4, y: 0, boost: false };
  for (let i = 0; i < 60 * 60; i++) {
    const p = f.tick(inp, DT);
    const r = p.position.length();
    if (r > peak) peak = r;
  }
  return { start, peak, gain: peak - start };
})();

// (b) GREAT CIRCLE. With no input at all the bird must fly a great circle —
//     i.e. every position stays in one plane through the planet's centre. A
//     controller that moves in a fixed WORLD direction instead of its own
//     forward fails this immediately, which is exactly the bug this port
//     exists to avoid re-introducing.
const greatCircle = (() => {
  const f = newFlight();
  const inp = { x: 0, y: 0, boost: false };
  const p0 = f.position.clone().normalize();
  for (let i = 0; i < 30; i++) f.tick(inp, DT);
  const p1 = f.position.clone().normalize();
  const n = p0.clone().cross(p1).normalize();
  let worst = 0;
  const d = new THREE.Vector3();
  for (let i = 0; i < 60 * 40; i++) {
    f.tick(inp, DT);
    d.copy(f.position).normalize();
    worst = Math.max(worst, Math.abs(d.dot(n)));
  }
  return worst;
})();

// (c) KNOCKDOWN REALIGN. The heading handed back after a tumble must be the
//     heading the player had going in, re-projected onto wherever they landed.
const knockdown = (() => {
  const f = newFlight();
  const inp = { x: 0, y: 0, boost: false };
  for (let i = 0; i < 120; i++) f.tick(inp, DT);
  const before = new THREE.Vector3(0, 0, -1).applyQuaternion(f.quaternion);
  const upBefore = f.position.clone().normalize();
  before.addScaledVector(upBefore, -before.dot(upBefore)).normalize();
  const rBefore = f.position.length();

  f.applyKnockdown();
  let fell = 0, tumbleFrames = 0, lastR = rBefore;
  while (f.state === FLIGHT_STATE.TUMBLING && tumbleFrames < 600) {
    f.tick(inp, DT);
    const r = f.position.length();
    if (r < lastR) fell += lastR - r;
    lastR = r;
    tumbleFrames++;
  }
  const relaunched = f.state !== FLIGHT_STATE.TUMBLING;
  const after = new THREE.Vector3(0, 0, -1).applyQuaternion(f.quaternion);
  const upAfter = f.position.clone().normalize();
  after.addScaledVector(upAfter, -after.dot(upAfter)).normalize();
  // Compare in the tangent plane at the landing point by parallel-transporting
  // the pre-tumble heading there.
  const transport = new THREE.Quaternion().setFromUnitVectors(upBefore, upAfter);
  const beforeHere = before.clone().applyQuaternion(transport);
  const align = after.dot(beforeHere);

  const rAfterLaunch = (() => {
    const r0 = f.position.length();
    for (let i = 0; i < 45; i++) f.tick(inp, DT);
    return f.position.length() - r0;
  })();

  return { relaunched, tumbleSeconds: tumbleFrames * DT, fell, align, launchGain: rAfterLaunch };
})();

// ---------------------------------------------------------------------------
// trajectory ribbon — the past positions, drawn so the sphere behaviour reads
// ---------------------------------------------------------------------------
// Stop the ribbon ~2 seconds short of the bird. The chase camera sits ON the
// path (11.5 units behind the bird), so a trail drawn all the way to the
// current position runs through the model, past the lens and out of frame as a
// giant foreground ramp. Trimming the last two seconds leaves the trail
// starting behind the camera, where it reads as history.
const TRAIL_TRIM = Math.round(2.0 / (DT * SAMPLE_EVERY));
const trailPts = path.slice(0, Math.max(2, path.length - TRAIL_TRIM));
const curve = new THREE.CatmullRomCurve3(trailPts, false, 'catmullrom', 0.5);
const trail = new THREE.Mesh(
  new THREE.TubeGeometry(curve, Math.min(1400, trailPts.length * 2), 0.22, 5, false),
  createToonMaterial(THREE, {
    color: PALETTE.ribbon, ramp: 'emissive',
    emissive: PALETTE.ribbon, emissiveIntensity: 0.55, fog: true,
  })
);
scene.add(trail);

// Ghost markers every 2s of flight, so speed along the path is legible.
const tickGeo = new THREE.OctahedronGeometry(0.62, 0);
const tickMat = createToonMaterial(THREE, {
  color: PALETTE.gateNext, ramp: 'graphic', emissive: PALETTE.gateNext, emissiveIntensity: 0.35,
});
const tickEvery = Math.round(2 / (DT * SAMPLE_EVERY));
const tickCount = Math.floor(trailPts.length / tickEvery);
const ticks = new THREE.InstancedMesh(tickGeo, tickMat, Math.max(1, tickCount));
const m4 = new THREE.Matrix4();
for (let i = 0; i < tickCount; i++) {
  const p = trailPts[i * tickEvery];
  m4.makeTranslation(p.x, p.y, p.z);
  ticks.setMatrixAt(i, m4);
}
ticks.instanceMatrix.needsUpdate = true;
scene.add(ticks);

// ---------------------------------------------------------------------------
// framing
// ---------------------------------------------------------------------------
const orbitCam = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 1, 4000);
function placeOrbitCam() {
  const c = new THREE.Vector3();
  for (const p of path) c.add(p);
  c.multiplyScalar(1 / path.length).normalize();
  orbitCam.position.copy(c).multiplyScalar(360);
  orbitCam.up.set(0, 1, 0);
  orbitCam.lookAt(0, 0, 0);
  orbitCam.aspect = innerWidth / innerHeight;
  orbitCam.updateProjectionMatrix();
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  placeOrbitCam();
  updateOutlineProjection(camera, renderer.domElement.height, renderer.getPixelRatio());
}
addEventListener('resize', resize);
resize();

planet.update(1.7, flight.position.x / PLANET_RADIUS, flight.position.y / PLANET_RADIUS, flight.position.z / PLANET_RADIUS);

const activeCam = view === 'orbit' ? orbitCam : camera;
if (view === 'orbit') { scene.fog.near = 300; scene.fog.far = 720; }
renderer.render(scene, activeCam);

// ---------------------------------------------------------------------------
// verdicts
// ---------------------------------------------------------------------------
// Outline widths are derived from tan(fov/2). The chase camera kicks the FOV
// with speed, so if it ever forgets to call updateOutlineProjection every ink
// line in the game silently fattens during a boost. Check the shared uniform
// actually agrees with the FOV the camera ended on.
const expectedUnitPerPixel =
  (2 * Math.tan((camera.fov * Math.PI) / 360) / renderer.domElement.height) * renderer.getPixelRatio();
const outlineDrift = Math.abs(outlineShared.uUnitPerPixel.value - expectedUnitPerPixel) / expectedUnitPerPixel;

const checks = [
  ['no floor clip', minClearance >= -1e-4, minClearance.toFixed(4)],
  ['descends below baseline', minRadius < PLANET_RADIUS, minRadius.toFixed(1)],
  ['stays on the planet', maxRadius < PLANET_RADIUS + 60, maxRadius.toFixed(1)],
  ['circles the planet', angleTravelled > Math.PI * 2, (angleTravelled / Math.PI).toFixed(2) + 'pi'],
  ['roll stays levelled', worstRoll < 0.35, worstRoll.toFixed(3)],
  ['pitch clamped', worstPitchAbs <= Math.sin(FLIGHT_CONFIG.maxPitch) + 0.02, worstPitchAbs.toFixed(3)],
  ['no upward ratchet', ratchet.gain < 0.01, ratchet.gain.toFixed(5)],
  ['great circle w/ no input', greatCircle < 0.02, greatCircle.toFixed(5)],
  ['tumble seen', sawTumble && sawRelaunch, String(sawTumble && sawRelaunch)],
  ['knockdown relaunches', knockdown.relaunched, knockdown.tumbleSeconds.toFixed(2) + 's'],
  ['knockdown falls', knockdown.fell > 4, knockdown.fell.toFixed(1)],
  ['heading realigned', knockdown.align > 0.9, knockdown.align.toFixed(3)],
  ['launch impulse outward', knockdown.launchGain > 0.5, knockdown.launchGain.toFixed(2)],
  ['camera never underground', minCamClearance > 0, minCamClearance.toFixed(3)],
  ['outline width tracks fov kick', outlineDrift < 0.005, (outlineDrift * 100).toFixed(3) + '%'],
  ['boost charged by diving', maxBoostSeen > 0.2, maxBoostSeen.toFixed(2)],
  ['boost beat the dive ceiling', maxSpeedSeen > FLIGHT_CONFIG.maxSpeed, maxSpeedSeen.toFixed(1)],
  ['speed never stalled (tumble floor)', minSpeedSeen >= FLIGHT_CONFIG.minSpeed * 0.5 - 1e-6, minSpeedSeen.toFixed(1)],
];
const failed = checks.filter((c) => !c[1]);

const stats = { drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
document.getElementById('hud').innerHTML =
  `view=${view} q=${quality} t=${DURATION}s  draws=${stats.drawCalls} tris=${stats.triangles}\n` +
  `speed ${minSpeedSeen.toFixed(1)}..${maxSpeedSeen.toFixed(1)}  r ${minRadius.toFixed(1)}..${maxRadius.toFixed(1)}\n` +
  `@stop=${STOP}s  v=${frozen.speed.toFixed(1)} boost=${frozen.boost.toFixed(2)} s01=${frozen.speed01.toFixed(2)} fov=${chase.fov.toFixed(1)}\n` +
  checks.map((c) => `${c[1] ? 'ok  ' : '<span class="bad">FAIL</span>'} ${c[0]} = ${c[2]}`).join('\n');

if (failed.length) {
  // Console errors fail the screenshot harness, so a captured frame is proof
  // the invariants held, not just proof that something drew.
  console.error('VYOM flight invariants failed: ' + failed.map((c) => `${c[0]}=${c[2]}`).join(', '));
}

window.__VYOM_ASSERTS = () => ({ checks, ratchet, greatCircle, knockdown });
window.__VYOM_STATS = () => ({
  drawCalls: renderer.info.render.calls,
  triangles: renderer.info.render.triangles,
});
window.__VYOM_READY = true;
</script>
</body>
</html>
