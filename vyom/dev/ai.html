<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYOM dev · ai racers</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1324; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 8px; top: 8px; z-index: 2;
    font: 11px/1.42 ui-monospace, Menlo, monospace;
    color: #fff6dc; text-shadow: 0 1px 2px #0f1c33, 0 0 6px #0f1c33;
    pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
import { loadThree } from '/vyom/src/core/three-loader.js';
import { PALETTE } from '/vyom/src/core/palette.js';
import { createToonMaterial, createLightRig } from '/vyom/src/core/toon.js';
import { updateOutlineProjection } from '/vyom/src/core/outline.js';
import {
  PLANET_RADIUS, surfaceRadius, biomeNoise, depthAt,
} from '/vyom/src/core/terrain.js';
import { createCourse } from '/vyom/src/race/course.js';
import {
  createRaceState, resetRaceState, startRace, updateStandings, formatTime, bestLap,
} from '/vyom/src/race/race-logic.js';
import { createAIRacers } from '/vyom/src/race/ai-racer.js';

const THREE = await loadThree();
const P = new URLSearchParams(location.search);

// view=race   -> chase framing on the pack, the frame the game ships
// view=corner -> above the tightest corner, so the three LINES are legible
// view=planet -> whole circuit from orbit
const view = P.get('view') || 'race';
const quality = P.get('quality') || 'high';
const showHud = P.get('hud') !== '0';
const SIM_MIN = parseFloat(P.get('sim') ?? '52');   // seconds of accelerated race

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PALETTE.fog, 70, 400);
const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.5, 4000);
createLightRig(THREE, scene);

// --- stand-in sky (sky.js belongs to another agent) -------------------------
{
  const skyGeo = new THREE.SphereGeometry(1600, 24, 16);
  const p = skyGeo.getAttribute('position');
  const col = new Float32Array(p.count * 3);
  const zen = new THREE.Color(PALETTE.skyZenith);
  const mid = new THREE.Color(PALETTE.skyMid);
  const hor = new THREE.Color(PALETTE.skyHorizon);
  const tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const t = THREE.MathUtils.clamp(p.getY(i) / 1600 * 0.5 + 0.5, 0, 1);
    if (t < 0.5) tmp.copy(hor).lerp(mid, t / 0.5); else tmp.copy(mid).lerp(zen, (t - 0.5) / 0.5);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false,
  }));
  sky.renderOrder = -10;
  scene.add(sky);
}

// --- stand-in terrain (planet.js belongs to another agent) -------------------
{
  const geo = new THREE.IcosahedronGeometry(PLANET_RADIUS, 34);
  const pos = geo.getAttribute('position');
  const colors = new Float32Array(pos.count * 3);
  const meadow = new THREE.Color(PALETTE.meadowLit), meadowD = new THREE.Color(PALETTE.meadowDeep);
  const canyon = new THREE.Color(PALETTE.canyonLit), canyonD = new THREE.Color(PALETTE.canyonDeep);
  const alpine = new THREE.Color(PALETTE.alpineLit), alpineD = new THREE.Color(PALETTE.alpineDeep);
  const a = new THREE.Color(), b = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const inv = 1 / Math.hypot(x, y, z);
    const nx = x * inv, ny = y * inv, nz = z * inv;
    const r = surfaceRadius(nx, ny, nz);
    pos.setXYZ(i, nx * r, ny * r, nz * r);
    const bn = biomeNoise(nx, ny, nz);
    const d = depthAt(nx, ny, nz);
    if (bn < 0.5) { a.copy(meadow); b.copy(meadowD); }
    else if (bn < 0.72) { a.copy(canyon); b.copy(canyonD); }
    else { a.copy(alpine); b.copy(alpineD); }
    a.lerp(b, Math.min(1, d * 1.15));
    colors[i * 3] = a.r; colors[i * 3 + 1] = a.g; colors[i * 3 + 2] = a.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, createToonMaterial(THREE, {
    ramp: 'terrain', vertexColors: true, specStrength: 0, rimStrength: 0.2,
  })));
}

// --- course ------------------------------------------------------------------
const course = createCourse(THREE, { quality, seed: 20260801, gateCount: 12 });
scene.add(course.group);

// --- the subsystem under test -------------------------------------------------
const ai = createAIRacers(THREE, {
  course, count: 3, quality, seed: 20260801, birdScale: 2.0,
});
scene.add(ai.group);

// =============================================================================
// Accelerated race
// =============================================================================
const race = createRaceState({ laps: 3, gateCount: 12, racerCount: 4 });
startRace(race, 0);

const DT = 1 / 60;
const TRAIL_EVERY = 4;
const trails = [[], [], []];

// Diagnostics — every claim in the HUD below is measured in this loop.
const diag = ai.racers.map(() => ({
  maxOff: 0, minClear: 1e9, meanAbsLat: 0, latSamples: 0,
  hairpinLat: 0, hairpinN: 0, minSpeed: 1e9, maxSpeed: 0,
}));
let minPairDist = 1e9;

// A stand-in player running a metronomic lap, purely to exercise the rubber
// band. 34 u/s is flight.js's cruise, i.e. a player who never boosts.
const PLAYER_SPEED = 34;

const _lp = new THREE.Vector3();
const _ls = new THREE.Vector3();
const _lu = new THREE.Vector3();
const _lt = new THREE.Vector3();
const _lv = new THREE.Vector3();

// Where is the tightest corner? The course reports its own authored segments,
// which is more honest than hunting for a curvature peak that a chicane can
// win. Fall back to the peak only if the report ever changes shape.
let hairpinT = 0.5;
{
  const seg = (course.segments || []).find((s) => /hairpin/i.test(s.name));
  if (seg) {
    hairpinT = (seg.tFrom + seg.tTo) * 0.5;
  } else {
    let peakI = 0;
    for (let i = 0; i < ai.kappa.length; i++) {
      if (Math.abs(ai.kappa[i]) > Math.abs(ai.kappa[peakI])) peakI = i;
    }
    hairpinT = peakI / ai.kappa.length;
  }
}

/** Diagnostics only — measured across the WHOLE race in pass 1. */
function sampleDiag() {
  for (let i = 0; i < ai.racers.length; i++) {
    const r = ai.racers[i];
    const d = diag[i];
    course.sampleAt(r.t, _lp);
    _lu.copy(_lp).normalize();
    course.tangentAt(r.t, _lt);
    _ls.crossVectors(_lt, _lu).normalize();
    const off = r.position.distanceTo(_lp);
    if (off > d.maxOff) d.maxOff = off;
    _lv.copy(r.position).sub(_lp);
    const lat = _lv.dot(_ls);
    d.meanAbsLat += Math.abs(lat); d.latSamples++;
    // Signed line preference through the hairpin: the number that says the
    // three personalities really do take different lines through one corner.
    let dt0 = Math.abs(r.t - hairpinT); if (dt0 > 0.5) dt0 = 1 - dt0;
    if (dt0 < 0.014) { d.hairpinLat += lat; d.hairpinN++; }

    _lu.copy(r.position).normalize();
    const clear = r.position.length() - surfaceRadius(_lu.x, _lu.y, _lu.z);
    if (clear < d.minClear) d.minClear = clear;
    if (r.speed < d.minSpeed) d.minSpeed = r.speed;
    if (r.speed > d.maxSpeed) d.maxSpeed = r.speed;

    for (let j = i + 1; j < ai.racers.length; j++) {
      const dd = r.position.distanceTo(ai.racers[j].position);
      if (dd < minPairDist) minPairDist = dd;
    }
  }
}

// --- pass 1: race the whole thing, and find the frame worth photographing ----
// The AI is deterministic, so pass 2 can replay to an exact step. Choosing the
// screenshot moment by wall-clock instead would photograph whatever happened to
// be there, which is how you ship a hero shot of an empty straight.
const MAX_SIM = 150;
let bestStep = Math.round(SIM_MIN * 60);
let raceSeconds = 0;
let bestSpread = 0;
{
  let bestScore = Infinity;
  let t = 0;
  let pp = 0;
  for (let s = 1; s <= MAX_SIM * 60; s++) {
    ai.update(DT, pp, race);
    pp += PLAYER_SPEED * DT / course.length;
    updateStandings(race);
    t += DT;
    if (t > 0.5) sampleDiag();
    if (t < 20) continue;
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < ai.racers.length; i++) {
      const g = ai.racers[i].progress;
      if (g < lo) lo = g;
      if (g > hi) hi = g;
    }
    const spreadU = (hi - lo) * course.length;
    const ki = Math.floor((ai.racers[0].t - Math.floor(ai.racers[0].t)) * ai.kappa.length);
    const corner = Math.abs(ai.kappa[ki] || 0);
    const score = spreadU - corner * 22;
    if (score < bestScore) { bestScore = score; bestStep = s; bestSpread = spreadU; }
  }
  raceSeconds = t;
}
const finalRace = {
  lap: Array.from(ai.racers, (r) => race.lap[r.raceIndex]),
  gates: Array.from(ai.racers, (r) => race.gatesPassed[r.raceIndex]),
  place: Array.from(ai.racers, (r) => race.place[r.raceIndex]),
  finish: Array.from(ai.racers, (r) => race.finishMs[r.raceIndex]),
  best: Array.from(ai.racers, (r) => bestLap(race, r.raceIndex)),
};

// --- pass 2: replay to that frame, recording the traced paths ----------------
ai.reset();
resetRaceState(race);
startRace(race, 0);
let simT = 0;
{
  let pp = 0;
  for (let s = 1; s <= bestStep; s++) {
    ai.update(DT, pp, race);
    pp += PLAYER_SPEED * DT / course.length;
    updateStandings(race);
    simT += DT;
    if (s % TRAIL_EVERY === 0) {
      for (let i = 0; i < ai.racers.length; i++) trails[i].push(ai.racers[i].position.clone());
    }
  }
}

// =============================================================================
// Traced paths, drawn as thin ribbons in each racer's colour
// =============================================================================
const trailGroup = new THREE.Group();
scene.add(trailGroup);
{
  const up = new THREE.Vector3(), fwd = new THREE.Vector3(), side = new THREE.Vector3();
  const c = new THREE.Color();
  const fogCol = new THREE.Color(PALETTE.fog);
  for (let i = 0; i < trails.length; i++) {
    const pts = trails[i];
    if (pts.length < 4) continue;
    const n = pts.length;
    const posArr = new Float32Array((n - 1) * 6 * 3);
    const colArr = new Float32Array((n - 1) * 6 * 3);
    const W = 0.55;
    const base = new THREE.Color(ai.racers[i].color);
    let o = 0;
    for (let k = 0; k < n - 1; k++) {
      const a = pts[k], b = pts[k + 1];
      up.copy(a).normalize();
      fwd.copy(b).sub(a);
      if (fwd.lengthSq() < 1e-9) continue;
      fwd.normalize();
      side.crossVectors(fwd, up).normalize().multiplyScalar(W);
      // Older samples fade toward the fog so the trail reads as history.
      const age = k / (n - 1);
      c.copy(base).lerp(fogCol, 0.45 * (1 - age));
      const ax = a.x, ay = a.y, az = a.z, bx = b.x, by = b.y, bz = b.z;
      const q = [
        ax - side.x, ay - side.y, az - side.z,
        ax + side.x, ay + side.y, az + side.z,
        bx + side.x, by + side.y, bz + side.z,
        ax - side.x, ay - side.y, az - side.z,
        bx + side.x, by + side.y, bz + side.z,
        bx - side.x, by - side.y, bz - side.z,
      ];
      for (let v = 0; v < 6; v++) {
        posArr[o] = q[v * 3]; posArr[o + 1] = q[v * 3 + 1]; posArr[o + 2] = q[v * 3 + 2];
        colArr[o] = c.r; colArr[o + 1] = c.g; colArr[o + 2] = c.b;
        o += 3;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    g.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    trailGroup.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.92,
      depthWrite: false, fog: true,
    })));
  }
}

// The traced paths are the point of the corner/planet views, but a chase
// camera sits INSIDE the pack's own history — so they come off for `race`.
trailGroup.visible = view !== 'race';

// =============================================================================
// Camera
// =============================================================================
const _p = new THREE.Vector3();
const _q = new THREE.Vector3();
const _u = new THREE.Vector3();
const _t = new THREE.Vector3();
const _mid = new THREE.Vector3();
const _sd = new THREE.Vector3();

function placeCamera() {
  const portrait = Math.min(1, Math.max(0, (1.0 - innerWidth / innerHeight) / 0.5));

  if (view === 'planet') {
    course.sampleAt(hairpinT, _p);
    _u.copy(_p).normalize();
    camera.position.copy(_u).multiplyScalar(330);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    scene.fog.near = 240; scene.fog.far = 760;
    return;
  }

  if (view === 'corner') {
    course.sampleAt(hairpinT, _p);
    course.tangentAt(hairpinT, _t);
    _u.copy(_p).normalize();
    camera.position.copy(_p)
      .addScaledVector(_u, 96 + 34 * portrait)
      .addScaledVector(_t, -6);
    camera.up.copy(_t);
    camera.lookAt(_p);
    scene.fog.near = 120; scene.fog.far = 460;
    return;
  }

  // race: behind and above the pack, aimed down the road at the corner ahead.
  // Anchor behind the LAST bird and stand off far enough that the whole pack
  // fits. A fixed stand-off frames whoever happens to be nearest and crops the
  // actual race out of the shot.
  let last = 0, lead = 0;
  for (let i = 1; i < ai.racers.length; i++) {
    if (ai.racers[i].progress < ai.racers[last].progress) last = i;
    if (ai.racers[i].progress > ai.racers[lead].progress) lead = i;
  }
  const packU = (ai.racers[lead].progress - ai.racers[last].progress) * course.length;
  const stand = Math.min(72, 26 + packU * 0.55) * (1 + 0.22 * portrait);
  _mid.copy(ai.racers[last].position);
  const tLead = ai.racers[last].t;
  course.tangentAt(tLead, _t);
  _u.copy(_mid).normalize();
  _sd.crossVectors(_t, _u).normalize();
  camera.position.copy(_mid)
    .addScaledVector(_t, -stand)
    .addScaledVector(_u, 10 + stand * 0.18 + 8 * portrait)
    .addScaledVector(_sd, 7);
  camera.up.copy(_u);
  // Aim at the middle of the pack, not at the road, so the birds own the frame.
  _q.copy(ai.racers[lead].position).add(ai.racers[last].position).multiplyScalar(0.5);
  camera.lookAt(_q);
  scene.fog.near = 80; scene.fog.far = 430;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  updateOutlineProjection(camera, renderer.domElement.height, renderer.getPixelRatio());
  placeCamera();
}
addEventListener('resize', resize);
resize();
renderer.render(scene, camera);

// =============================================================================
// Report — measured, never asserted
// =============================================================================
const stats = { drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };

let lines = '';
for (let i = 0; i < ai.racers.length; i++) {
  const r = ai.racers[i];
  const d = diag[i];
  lines += `${r.name.padEnd(7)} ${r.personality.padEnd(11)}` +
    ` P${finalRace.place[i]} ${formatTime(finalRace.finish[i])}` +
    ` g${finalRace.gates[i]}` +
    ` v ${d.minSpeed.toFixed(0)}-${d.maxSpeed.toFixed(0)}` +
    ` off<=${d.maxOff.toFixed(1)}` +
    ` clr>=${d.minClear.toFixed(1)}` +
    ` apexLat ${(d.hairpinN ? d.hairpinLat / d.hairpinN : 0).toFixed(2)}` +
    ` best ${formatTime(finalRace.best[i])}\n`;
}

const apex = diag.map((d) => (d.hairpinN ? d.hairpinLat / d.hairpinN : 0));
const spread = Math.max(...apex) - Math.min(...apex);
const minClearAll = Math.min(...diag.map((d) => d.minClear));
const maxOffAll = Math.max(...diag.map((d) => d.maxOff));
const gates = finalRace.gates;

const checks = [
  ['never through terrain', minClearAll > 1.0, minClearAll.toFixed(2)],
  ['never left the track', maxOffAll < 14, maxOffAll.toFixed(2)],
  ['never stacked up', minPairDist > 2.2, minPairDist.toFixed(2)],
  ['every gate of 3 laps counted', Math.min(...gates) === 36, gates.join('/')],
  ['lines are distinct', spread > 1.6, spread.toFixed(2)],
];
let checkText = '';
for (const [name, ok, val] of checks) checkText += `${ok ? 'PASS' : 'FAIL'} ${name} (${val})\n`;

const hud = document.getElementById('hud');
hud.textContent = showHud
  ? `view=${view} q=${quality}  race ${raceSeconds.toFixed(0)}s, shot at ${simT.toFixed(1)}s (@60Hz)\n` +
    `frame draws=${stats.drawCalls} tris=${stats.triangles}\n` +
    `ai built draws=${ai.drawCallCount} tris=${ai.triangleCount}  lap ${course.length.toFixed(0)}u\n` +
    lines + checkText
  : '';

window.__VYOM_AI = ai;
window.__VYOM_STATS = () => ({
  drawCalls: renderer.info.render.calls,
  triangles: renderer.info.render.triangles,
  aiDrawCalls: ai.drawCallCount,
  aiTriangles: ai.triangleCount,
  simSeconds: +simT.toFixed(2),
  packSpreadU: +bestSpread.toFixed(1),
  raceSeconds: +raceSeconds.toFixed(1),
  finishMs: finalRace.finish.map((v) => Math.round(v)),
  minClear: +minClearAll.toFixed(2),
  maxOff: +maxOffAll.toFixed(2),
  minPairDist: +minPairDist.toFixed(2),
  apexLat: apex.map((v) => +v.toFixed(2)),
  gates,
  checks: checks.map(([n, ok, v]) => `${ok ? 'PASS' : 'FAIL'} ${n} ${v}`),
});
window.__VYOM_READY = true;
</script>
</body>
</html>
